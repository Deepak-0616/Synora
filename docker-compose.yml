services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_MODE=postgres
      - DATABASE_URL=postgresql://synora_user:synora_secure_pass_2026@postgres:5432/synora_db
      - JWT_SECRET=synora-production-deployment-secret-key-2026
    depends_on:
      - postgres
    volumes:
      - api-uploads:/app/uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: synora_user
      POSTGRES_PASSWORD: synora_secure_pass_2026
      POSTGRES_DB: synora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
  api-uploads:
